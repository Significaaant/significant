<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiches théoriques — Significant</title>
    <meta name="description" content="Fiches théoriques de statistiques : loi normale, tests paramétriques, régression et plus encore.">
    <link rel="stylesheet" href="style.css?v=13">
    <script src="translations.js?v=12" defer></script>
    <script src="quiz_test_meta.js?v=11" defer></script>
    <script src="booster_cards_engine.js?v=14" defer></script>
    <script src="i18n.js?v=11" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        /* Specific Theory Override Styles */
        body {
            padding-top: 2rem;
            color: var(--ink-2, #4A3F35);
        }

        h1.theory-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-family: 'DM Serif Display', Georgia, serif;
            color: var(--ink, #1A1410);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .theory-subtitle {
            font-size: 1.15rem;
            color: var(--ink-3, #7A6E64);
            margin-bottom: 3rem;
            font-style: italic;
            border-bottom: 1px solid var(--surface-2, #E2DAD0);
            padding-bottom: 2rem;
            text-align: center;
        }

        /* Summary TOC Grid — max 2 colonnes pour éviter le bento 3-cartes */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.5rem;
            color: var(--ink-3, #7A6E64);
        }

        /* ===== Search Bar ===== */
        .theory-search-wrapper {
            position: relative;
            max-width: 680px;
            margin: 0 auto 3rem;
        }

        .theory-search-bar {
            width: 100%;
            padding: 0.9rem 3rem 0.9rem 3rem;
            border-radius: 6px;
            border: 1px solid var(--surface-2, #E2DAD0);
            background: var(--surface, #EDE8DF);
            color: var(--ink, #1A1410);
            font-size: 1rem;
            font-family: 'Source Serif 4', Georgia, serif;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .theory-search-bar:focus {
            border-color: var(--bordeaux, #6B2D3E);
        }

        .theory-search-bar::placeholder {
            color: var(--ink-3, #7A6E64);
        }

        .theory-search-icon {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-3, #7A6E64);
            pointer-events: none;
        }

        .search-count-badge {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.78rem;
            color: var(--bordeaux, #6B2D3E);
            background: var(--bordeaux-soft, #F0E6EA);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 700;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        /* Card enhancements */
        .card-subtitle-small {
            font-size: 0.82rem;
            color: var(--ink-3, #7A6E64);
            margin: 0.25rem 0 0;
            font-style: italic;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.7rem;
        }

        .card-tag {
            font-size: 0.68rem;
            background: var(--bordeaux-soft, #F0E6EA);
            color: var(--bordeaux, #6B2D3E);
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .bloc-section {
            transition: opacity 0.2s;
        }

        .bloc-section.search-hide {
            display: none !important;
        }

        .theory-card {
            background: var(--surface, #EDE8DF);
            padding: 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
            border: 1px solid var(--surface-2, #E2DAD0);
        }

        .theory-card:hover {
            border-color: var(--bordeaux, #6B2D3E);
        }

        .theory-card.search-hide {
            display: none !important;
        }

        .no-results-msg {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--ink-3, #7A6E64);
            font-size: 1.2rem;
            display: none;
        }

        /* ===== Fiche Detail View ===== */
        .fiche-header {
            text-align: center;
            margin-bottom: 3.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--surface-2, #E2DAD0);
        }

        .fiche-bloc-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--bordeaux, #6B2D3E);
            background: var(--bordeaux-soft, #F0E6EA);
            border: 1px solid var(--bordeaux, #6B2D3E);
            padding: 0.25rem 0.8rem;
            border-radius: 3px;
            margin-bottom: 1.2rem;
        }

        .fiche-main-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            color: var(--ink, #1A1410);
            margin: 0;
            line-height: 1.2;
            font-family: 'DM Serif Display', Georgia, serif;
        }

        /* Section cards / Encarts */
        .flexible-content {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            max-width: 860px;
            margin: 0 auto;
        }

        .section-card {
            border-radius: 6px;
            padding: 1.5rem 2rem;
            position: relative;
            border: 1.5px solid var(--surface-2, #E2DAD0);
            background: #FAF8F5;
            transition: border-color 0.2s, background 0.2s;
        }

        .section-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--ink, #1A1410);
            margin: 0 0 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-body);
        }

        .section-card-body {
            font-size: 1.05rem;
            line-height: 1.75;
            color: var(--ink-2, #382F28);
        }

        .section-card-body ul {
            margin: 0.4rem 0 0.4rem 1.2rem;
            padding: 0;
        }

        .section-card-body li {
            margin-bottom: 0.35rem;
            color: var(--ink-2, #382F28);
        }

        .section-card-body strong {
            color: var(--ink, #1A1410);
            font-weight: 700;
        }

        .section-card-body blockquote {
            border-left: 3px solid var(--bordeaux, #6B2D3E);
            padding: 0.6rem 1.1rem;
            margin: 0.9rem 0;
            font-style: italic;
            background: rgba(107, 45, 62, 0.05);
            color: var(--ink-2, #382F28);
            border-radius: 0 6px 6px 0;
        }

        /* Layout variants — Encarts clairs avec bordures d'accent et texte foncé net */
        .section-standard {
            border-left: 4px solid var(--bordeaux, #6B2D3E);
            background: #FAF8F5;
        }

        .section-highlight {
            border: 1.5px solid #F0D5DD;
            border-left: 4px solid var(--bordeaux, #6B2D3E);
            background: #FCF5F7;
        }

        .section-highlight .section-card-title {
            color: var(--bordeaux, #6B2D3E);
        }

        .section-alert {
            border: 1.5px solid #F6D5CB;
            border-left: 4px solid #C0441D;
            background: #FDF5F2;
        }

        .section-alert .section-card-title {
            color: #A33310;
        }

        /* Formula blocks */
        .section-card-body .formula-line {
            display: block;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: var(--bordeaux, #6B2D3E);
            background: #FAF8F5;
            border: 1px solid var(--surface-2, #E2DAD0);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            margin: 0.8rem 0;
            letter-spacing: 0.01em;
        }

        /* Numbered lists */
        .section-card-body ol {
            margin: 0.4rem 0 0.4rem 1.2rem;
            padding: 0;
        }

        .section-card-body ol li {
            margin-bottom: 0.4rem;
            color: var(--ink-2, #382F28);
        }

        /* Encart de synthèse 'À retenir' */
        .fiche-footer {
            max-width: 860px;
            margin: 2.5rem auto 0;
            padding: 1.3rem 1.6rem;
            border-radius: 8px;
            background: #FAF8F5;
            border: 1.5px solid var(--surface-2, #E2DAD0);
            border-left: 4px solid var(--bordeaux, #6B2D3E);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            line-height: 1.6;
        }

        .fiche-footer-badge {
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--bordeaux, #6B2D3E);
            background: var(--bordeaux-soft, #F5EBF0);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }

        .fiche-footer-text {
            font-size: 0.98rem;
            color: var(--ink-2, #382F28);
            line-height: 1.6;
            font-style: normal;
        }

        /* Figure block */
        .fiche-figure {
            max-width: 860px;
            margin: 0.5rem auto;
            text-align: center;
        }

        .fiche-figure img {
            max-width: 100%;
            border-radius: 6px;
            border: 1px solid var(--surface-2, #E2DAD0);
            background: #fff;
            padding: 1rem;
        }

        .fiche-figure figcaption {
            margin-top: 0.6rem;
            font-size: 0.82rem;
            font-style: italic;
            color: var(--ink-3, #7A6E64);
        }
    </style>
</head>

<body>

    <!-- Loader -->
    <div id="page-loader">
        <div class="loader-inner">
            <div class="loader-wordmark">significant</div>
            <div class="loader-shimmer-text text-shimmer" data-i18n="loading">Chargement...</div>
            <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
        </div>
    </div>



    <nav class="navbar" role="navigation" aria-label="Navigation principale">
        <a href="index.html" class="logo" aria-label="Significant — Accueil">significant <span>stats</span></a>
        <div class="nav-links">
            <a href="index.html" data-i18n="nav-accueil">Accueil</a>
            <a href="index.html#quiz" data-i18n="nav-quiz">Quiz</a>
            <a href="methodo.html" data-i18n="nav-methodo">Méthodo</a>
            <a href="theory.html" class="active" data-i18n="nav-fiches">Fiches</a>
            <a href="about.html" data-i18n="nav-about">À propos</a>
            <button id="lang-toggle" class="lang-btn" aria-label="Changer de langue">EN</button>
        </div>
    </nav>

    <div class="theory-container container">

        <div id="theory-content">
            <div class="loading text-shimmer" data-i18n="loading">Chargement des fiches...</div>
        </div>
    </div>

    <!-- Load Data Dynamically (V48: Royal Light Theme Integration) -->
    <script>
        (function () {
            const currentLang = localStorage.getItem('site-lang') || 'fr';
            const script = document.createElement('script');
            const timestamp = Date.now();
            script.src = (currentLang === 'en' ? 'theory_content_en.js' : 'theory_content.js') + '?v=' + timestamp;

            script.onload = () => {
                const params = new URLSearchParams(window.location.search);
                const pageId = params.get('id');
                const container = document.getElementById('theory-content');

                // Thème clair unifié sur tout le site
                localStorage.removeItem('theory-theme');
                document.body.classList.remove('theme-midnight', 'theme-fiche-dark');
                document.body.classList.add('theme-fiche-light');

                function getT(key) {
                    const lang = localStorage.getItem('site-lang') || 'fr';
                    return uiTranslations[lang][key] || key;
                }

                const blocks = {
                    0: getT('bloc-0'),
                    1: getT('bloc-1'),
                    2: getT('bloc-2'),
                    3: getT('bloc-3'),
                    4: getT('bloc-4'),
                    5: getT('bloc-5'),
                    6: getT('bloc-6')
                };

                if (pageId && theoryData[pageId]) {
                    const data = theoryData[pageId];

                    // --- Improved formatText ---
                    function formatText(text) {
                        if (!text) return '';
                        let html = text
                            // Bold formulas on their own line -> formula-line block
                            .replace(/^\*\*([^\n]+)\*\*$/gm, '<span class="formula-line">$1</span>')
                            // Remaining inline bold
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                            // Blockquote
                            .replace(/^> ?(.*?)$/gm, '<blockquote>$1</blockquote>')
                            // Numbered list items  (1. 2. 3.)
                            .replace(/^(\d+)\.\  *(.*?)$/gm, '<li data-n="$1">$2</li>')
                            // Bullet items
                            .replace(/^\*   ?(.*?)$/gm, '<li>$1</li>');
                        // Wrap consecutive <li> sequences
                        html = html.replace(/(<li[^>]*>.*?<\/li>\n?)+/g, (m) => {
                            if (m.includes('data-n=')) return `<ol>${m}</ol>`;
                            return `<ul>${m}</ul>`;
                        });
                        html = html.replace(/\n/g, '<br>');
                        return html;
                    }

                    // --- Header with category badge ---
                    let contentHtml = `
                        <button class="back-btn" onclick="window.location.href='theory.html'" style="color: var(--bordeaux);">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 12H5M12 19l-7-7 7-7"/>
                            </svg>
                            <span data-i18n="nav-retour">${getT('nav-retour')}</span>
                        </button>

                        <div class="fiche-header animate-pop">
                            ${blocks[data.bloc] ? `<span class="fiche-bloc-badge">${blocks[data.bloc]}</span>` : ''}
                            <h1 class="fiche-title">${data.title}</h1>
                            ${data.subtitle ? `<p class="card-subtitle-small" style="font-size: 1.1rem; margin-top: 0.5rem; color: var(--ink-3);">${data.subtitle}</p>` : ''}
                        </div>

                        ${data.definition ? `
                            <div class="chapter-section">
                                <h2 data-i18n="theory-definition">${getT('theory-definition')}</h2>
                                <div class="rich-content" style="font-size: 1.3rem;">${formatText(data.definition)}</div>
                            </div>
                        ` : ''}
                    `;;

                    // --- Type Specific Content ---
                    switch (data.type) {
                        case "TYPE_TEST":
                            contentHtml += `
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-usage">${getT('theory-usage')}</h2>
                                    <div class="rich-content">${formatText(data.usage)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-hyp-duel">${getT('theory-hyp-duel')}</h2>
                                    <div class="step-card" style="border-left-color: #ef4444;"><strong>H0 :</strong> ${formatText(data.h0)}</div>
                                    <div class="step-card" style="border-left-color: #10b981;"><strong>H1 :</strong> ${formatText(data.h1)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-conditions">${getT('theory-conditions')}</h2>
                                    <ul class="var-list">
                                        ${data.conditions.map(c => `<li>${formatText(c)}</li>`).join('')}
                                    </ul>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-effect-size">${getT('theory-effect-size')}</h2>
                                    <div class="rich-content">${formatText(data.size_effect)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-report">${getT('theory-report')}</h2>
                                    <div class="step-card" style="border-left-color: var(--accent-color); font-style: italic;">"${formatText(data.report)}"</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-quick-code">${getT('theory-quick-code')}</h2>
                                    <p><strong>R :</strong> <code class="code-snippet">${data.codeR}</code></p>
                                    <p><strong>Jamovi :</strong> <code class="code-snippet">${data.codeJamovi}</code></p>
                                </div>
                            `;
                            break;

                        case "TYPE_INDICATOR":
                            contentHtml += `
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-intuition">${getT('theory-intuition')}</h2>
                                    <div class="rich-content">${formatText(data.intuition)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-robustness">${getT('theory-robustness')}</h2>
                                    <div class="rich-content">${formatText(data.sensibility)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-duel">${getT('theory-duel')}</h2>
                                    <div class="rich-content">${formatText(data.duel)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-manual-calc">${getT('theory-manual-calc')}</h2>
                                    ${data.calculation.map((step, i) => `
                                        <div class="step-card"><strong>${getT('theory-step')} ${i + 1} :</strong> ${formatText(step)}</div>
                                    `).join('')}
                                </div>
                            `;
                            break;

                        case "TYPE_CONCEPT":
                            contentHtml += `
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-context">${getT('theory-context')}</h2>
                                    <div class="rich-content">${formatText(data.context)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-debunk">${getT('theory-debunk')}</h2>
                                    <div class="step-card" style="border-left-color: #eab308;">${formatText(data.debunk)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-link-tests">${getT('theory-link-tests')}</h2>
                                    <div class="rich-content">${formatText(data.link)}</div>
                                </div>
                            `;
                            break;

                        case "TYPE_FLEXIBLE":
                            contentHtml += `
                                <div class="flexible-content">
                                    ${data.sections.map(section => {
                                const layoutClass = section.layout === 'highlight' ? 'section-highlight'
                                    : section.layout === 'alert' ? 'section-alert'
                                        : 'section-standard';
                                return `
                                        <div class="section-card ${layoutClass}">
                                            ${section.title ? `<div class="section-card-title">${section.title}</div>` : ''}
                                            <div class="section-card-body">${formatText(section.content)}</div>
                                        </div>`;
                            }).join('')}
                                    ${data.figure ? `
                                        <figure class="fiche-figure">
                                            <img src="${data.figure.src}" alt="${data.figure.caption}" loading="lazy">
                                            <figcaption>${data.figure.caption}</figcaption>
                                        </figure>
                                    ` : ''}
                                    ${data.footer ? `
                                        <div class="fiche-footer">
                                            <span class="fiche-footer-badge" data-i18n="theory-takeaway">${getT('theory-takeaway') || 'À retenir'}</span>
                                            <div class="fiche-footer-text">${formatText(data.footer)}</div>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                            break;

                        case "TYPE_SOS":
                            contentHtml += `
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-symptoms">${getT('theory-symptoms')}</h2>
                                    <div class="rich-content" style="color: #f87171; font-weight: bold;">${formatText(data.symptom)}</div>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-remedy">${getT('theory-remedy')}</h2>
                                    ${data.fix.map(f => `<div class="step-card" style="border-left-color: #22c55e;">${formatText(f)}</div>`).join('')}
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-rescue-cmd">${getT('theory-rescue-cmd')}</h2>
                                    <p><strong>R :</strong> <code class="code-snippet">${data.codeR}</code></p>
                                    <p><strong>Jamovi :</strong> <code class="code-snippet">${data.codeJamovi}</code></p>
                                </div>
                            `;
                            break;

                        case "TYPE_DATA":
                            contentHtml += `
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-ingredients">${getT('theory-ingredients')}</h2>
                                    <ul class="var-list">
                                        ${data.subjects.map(s => `<li>${formatText(s)}</li>`).join('')}
                                    </ul>
                                </div>
                                <div class="chapter-section">
                                    <h2 data-i18n="theory-recipe">${getT('theory-recipe')}</h2>
                                    ${data.how_to.map((step, i) => `
                                        <div class="step-card"><strong>${getT('theory-step')} ${i + 1} :</strong> ${formatText(step)}</div>
                                    `).join('')}
                                </div>
                            `;
                            break;
                    }

                    container.innerHTML = contentHtml;
                } else {
                    const placeholderTxt = currentLang === 'fr' ? 'Rechercher un concept, une formule...' : 'Search a concept, formula...';
                    const noResultTxt = currentLang === 'fr' ? 'Aucun résultat pour cette recherche.' : 'No results found.';

                    let summaryHtml = `
                        <!-- ==============================================
                             SECTION TESTS STATISTIQUES (DECK EN LIGNE + INDEX)
                             ============================================== -->
                        <section class="theory-deck-section" id="theory-deck-section">
                            <div class="theory-deck-header">
                                <h2 class="theory-deck-title" data-i18n="theory-deck-title">${getT('theory-deck-title') || 'Tests statistiques'}</h2>
                                
                                <div class="theory-deck-filter-bar">
                                    <button type="button" class="deck-filter-btn active" onclick="filterTheoryCardsDeck('all', this)" data-i18n="theory-deck-filter-all">${getT('theory-deck-filter-all') || 'Tous les tests'}</button>
                                    <button type="button" class="deck-filter-btn" onclick="filterTheoryCardsDeck('comparer', this)" data-i18n="theory-deck-filter-compare">${getT('theory-deck-filter-compare') || 'Comparer'}</button>
                                    <button type="button" class="deck-filter-btn" onclick="filterTheoryCardsDeck('relation', this)" data-i18n="theory-deck-filter-link">${getT('theory-deck-filter-link') || 'Relation'}</button>
                                    <button type="button" class="deck-filter-btn" onclick="filterTheoryCardsDeck('predire', this)" data-i18n="theory-deck-filter-predict">${getT('theory-deck-filter-predict') || 'Prédire'}</button>
                                    <button type="button" class="deck-filter-btn" onclick="filterTheoryCardsDeck('decrire', this)" data-i18n="theory-deck-filter-desc">${getT('theory-deck-filter-desc') || 'Décrire'}</button>
                                    <button type="button" class="deck-filter-btn" onclick="filterTheoryCardsDeck('verifier', this)" data-i18n="theory-deck-filter-check">${getT('theory-deck-filter-check') || 'Vérifier'}</button>
                                </div>
                            </div>

                            <div class="theory-deck-layout">
                                <!-- Volet latéral : Liste alphabétique des tests -->
                                <aside class="theory-deck-sidebar">
                                    <div class="deck-sidebar-header">
                                        <span class="deck-sidebar-title" data-i18n="theory-deck-index-title">${getT('theory-deck-index-title') || 'Index alphabétique'}</span>
                                        <span class="deck-sidebar-count" id="deck-list-count">31 tests</span>
                                    </div>
                                    <div class="deck-alphabetical-list" id="theory-cards-list" role="list">
                                        <!-- Rempli dynamiquement -->
                                    </div>
                                </aside>

                                <!-- Volet principal : Ruban horizontal avec flèches de défilement -->
                                <div class="theory-deck-carousel-wrapper">
                                    <button type="button" class="deck-ribbon-arrow prev" onclick="scrollDeckRibbon(-320)" aria-label="${getT('theory-deck-scroll-left') || 'Défiler à gauche'}">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="15 18 9 12 15 6"></polyline>
                                        </svg>
                                    </button>

                                    <div class="theory-cards-ribbon" id="theory-cards-ribbon" role="region" aria-label="Deck de mini-cartes">
                                        <!-- Mini-cartes injectées dynamiquement -->
                                    </div>

                                    <button type="button" class="deck-ribbon-arrow next" onclick="scrollDeckRibbon(320)" aria-label="${getT('theory-deck-scroll-right') || 'Défiler à droite'}">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </section>

                        <h1 class="theory-title" data-i18n="summary-title">${getT('summary-title')}</h1>
                        <p class="theory-subtitle" data-i18n="summary-subtitle">${getT('summary-subtitle')}</p>

                        <div class="theory-search-wrapper">
                            <svg class="theory-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                            </svg>
                            <input type="text" id="theory-search" class="theory-search-bar" placeholder="${placeholderTxt}" autocomplete="off">
                            <span id="search-count-badge" class="search-count-badge"></span>
                        </div>
                        <p id="no-results-msg" class="no-results-msg">${noResultTxt}</p>
                    `;

                    const blocKeys = [0, 1, 2, 3, 4, 5, 6];
                    for (const i of blocKeys) {
                        const blocFiches = Object.entries(theoryData).filter(([k, v]) => v.bloc === i);
                        if (blocFiches.length > 0) {
                            const cardsHtml = blocFiches.map(([key, item]) => {
                                const searchable = [item.title, item.subtitle || '', ...(item.tags || [])].join(' ').toLowerCase();
                                const tagsHtml = (item.tags || []).slice(0, 4).map(t => `<span class="card-tag">${t}</span>`).join('');
                                return `
                                    <div class="theory-card" data-searchable="${searchable}" onclick="window.location.href='?id=${key}'">
                                        <h3 style="font-family: var(--font-serif); color: var(--ink); margin: 0 0 0.35rem; font-size: 1.15rem; font-weight: 600;">${item.title}</h3>
                                        ${item.subtitle ? `<p class="card-subtitle-small">${item.subtitle}</p>` : ''}
                                        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
                                    </div>`;
                            }).join('');
                            summaryHtml += `
                                <div class="bloc-section" data-bloc="${i}">
                                    <h2 style="margin-top: 3.5rem; font-family: var(--font-serif); color: var(--bordeaux); font-size: 1.8rem; border-bottom: 1px solid var(--surface-2); padding-bottom: 0.6rem; margin-bottom: 1.8rem;">${blocks[i]}</h2>
                                    <div class="grid-3" style="column-gap: 1.5rem; row-gap: 1.5rem;">${cardsHtml}</div>
                                </div>`;
                        }
                    }

                    container.innerHTML = summaryHtml;

                    if (typeof renderTheoryCardsGallery === 'function') {
                        renderTheoryCardsGallery('theory-cards-ribbon', 'theory-cards-list');
                    }

                    // ===== Live Search =====
                    const searchInput = document.getElementById('theory-search');
                    const countBadge = document.getElementById('search-count-badge');
                    const noResMsg = document.getElementById('no-results-msg');

                    searchInput.addEventListener('input', () => {
                        const q = searchInput.value.trim().toLowerCase();
                        const allCards = document.querySelectorAll('.theory-card');
                        const allBlocs = document.querySelectorAll('.bloc-section');
                        let visible = 0;

                        allCards.forEach(card => {
                            const match = !q || card.dataset.searchable.includes(q);
                            card.classList.toggle('search-hide', !match);
                            if (match) visible++;
                        });

                        allBlocs.forEach(bloc => {
                            const hasVisible = [...bloc.querySelectorAll('.theory-card')].some(c => !c.classList.contains('search-hide'));
                            bloc.classList.toggle('search-hide', !hasVisible);
                        });

                        noResMsg.style.display = (visible === 0 && q) ? 'block' : 'none';
                        const resWord = currentLang === 'fr' ? 'résultat' : 'result';
                        countBadge.textContent = q ? `${visible}\u00a0${resWord}${visible !== 1 ? 's' : ''}` : '';
                    });

                    // Auto-focus search bar
                    searchInput.focus();
                }
            };
            document.head.appendChild(script);
        })();
    </script>

    <footer class="site-footer" role="contentinfo">
        <div class="footer-links">
            <a href="index.html" data-i18n="nav-accueil">Accueil</a>
            <a href="theory.html" data-i18n="nav-fiches">Fiches théoriques</a>
            <a href="gpower.html" data-i18n="nav-gpower">G*Power</a>
            <a href="glossary.html" data-i18n="nav-glossaire">Glossaire</a>
            <a href="privacy.html">Politique de confidentialité</a>
            <a href="legal.html">Mentions légales</a>
        </div>
    </footer>

        window.addEventListener('load', function() {
            const loader = document.getElementById('page-loader');
            if (loader) { loader.classList.add('hidden'); setTimeout(() => loader.remove(), 500); }
        });
    </script>
</body>
